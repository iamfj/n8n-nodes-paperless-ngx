# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade, add @n8n/node-cli@latest as a dev dependency using your package manager.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open your package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: <your-github-username-or-org>
#        Repository name:  <your-repo-name>
#        Workflow name:    publish.yml
#        Environment:      (leave blank unless you use GitHub Environments)
#   4. Leave the NPM_TOKEN secret unset in this repository. GitHub's OIDC
#      token is used instead — no secret ever touches your repo settings.
#
# Option B — npm Automation Token (fallback):
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token.
#      Scope it to this package with "Read and write" publish permission.
#   2. In GitHub: Settings → Secrets and variables → Actions → New secret.
#      Name it NPM_TOKEN and paste the token value.
#
# Both options work with --provenance. Provenance is signed by GitHub's OIDC
# infrastructure regardless of how npm authentication is handled.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run the following command locally to start an interactive release:
#
#   npm run release
#
# This will lint, build, prompt for a version bump, update the changelog,
# commit, tag, and push — which triggers this workflow to publish to npm.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      # Digest-pinned, not tag-pinned. This job holds `id-token: write` and npm
      # publish rights, so a repointed action tag here would be able to sign a
      # tampered tarball with this repo's provenance.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        # --ignore-scripts because this is the one job that can sign a release.
        # A malicious postinstall in any transitive dev dependency would run
        # before the build, with the ability to alter dist/ -- and the provenance
        # attestation minted below would then vouch for the tampered output.
        # Nothing in the release path (lint, build, publish) needs install
        # scripts; CI runs the same toolchain this way already.
        run: npm ci --ignore-scripts

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # Lint and build run automatically as part of the release process.
        #
        # Option A (OIDC): leave NPM_TOKEN unset — the token step is skipped and
        #   npm uses the OIDC exchange instead.
        # Option B (token): set NPM_TOKEN in repo secrets — it is written to
        #   an .npmrc here before publishing.
        # Note: written as an if-block rather than `[ -n "$NPM_TOKEN" ] && ...`
        # because steps run under `bash -e`, where a failing test as the last
        # command of an AND-list aborts the step — which would break Option A,
        # the very path that is meant to leave NPM_TOKEN unset.
        #
        # NPM_CONFIG_USERCONFIG redirects that write away from `~/.npmrc`, which
        # every later npm and npx invocation in this job would otherwise read.
        # The variable does not outlive the step, but the file would -- and the
        # scanner step below runs third-party code on the same runner -- so the
        # trap deletes it however this step exits.
        run: |
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/publish.npmrc"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package with n8n's scanner
        # This is n8n's own static analysis — the same check that decides whether
        # the package is eligible for verification in the Creator Portal. Its first
        # assertion is that the release carries an npm provenance attestation, so
        # it proves the provenance above actually landed rather than silently
        # degrading to an unsigned publish.
        #
        # It only runs here, never in CI on a PR: the CLI resolves a package *by
        # name from the registry* and unpacks the published tarball. It has no
        # local-directory mode, so there is nothing for it to scan before release.
        #
        # Finding a failure now beats finding it during a verification submission
        # weeks later, when the offending version is long since public.
        #
        # The retry is not superstition: the registry needs a moment to serve a
        # just-published version, and a 404 here would otherwise fail a release
        # that in fact succeeded.
        #
        # The scanner is pinned: `npx --yes` on a floating name fetches and runs
        # whatever was published minutes ago, in the one job that can sign a
        # release. The pin buys the three-day cooldown on the scanner itself --
        # Renovate keeps it current via the comment below. It does not stop
        # install scripts, and the scanner's own dependencies still resolve from
        # floating ranges at this moment, so ignore-scripts is set as well.
        env:
          # renovate: datasource=npm depName=@n8n/scan-community-package
          SCANNER_VERSION: 0.32.0
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          PKG="@iamfj/n8n-nodes-paperless-ngx@${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            if npx --yes "@n8n/scan-community-package@${SCANNER_VERSION}" "$PKG"; then
              exit 0
            fi
            echo "Scan attempt $attempt failed; the registry may not serve $PKG yet."
            sleep 15
          done
          echo "::error::$PKG failed @n8n/scan-community-package after 5 attempts."
          exit 1
