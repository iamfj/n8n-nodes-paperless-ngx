name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
# head_ref is set on pull_request events and groups the PR's runs together;
# ref covers pushes to main, where head_ref is empty.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      # Report every failing Node version, not just the first one to fall over.
      fail-fast: false
      matrix:
        # 20 is the floor n8n still supports; 22 is the current LTS.
        node-version: [20, 22]

    steps:
      # Pinned to a digest, not a tag: a tag is mutable, so whoever owns the
      # action's repo can repoint v7 at any commit and it runs here on the next
      # push. Renovate keeps the pins current -- see .github/renovate.json5.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        # --ignore-scripts skips native compilation. n8n-workflow pulls in
        # isolated-vm transitively, which fails to build against Node 20's V8
        # headers; nothing in lint, typecheck, test or build ever executes it,
        # and n8n-workflow is a devDependency that never ships. Compiling it here
        # would only buy a broken matrix leg.
        run: npm ci --ignore-scripts

      - name: Check formatting and lint rules
        run: npx biome ci .

      - name: Run lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Run tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify package contents
        # Asserts what `npm pack` would publish: the entry points named in the
        # `n8n` block, the codex file and both icons, that no runtime dependency
        # crept back in, and that `n8n-workflow` stays an optional peer. Nothing
        # else in this matrix looks at the tarball, and a packaging defect only
        # shows up on someone else's instance.
        run: npm run verify:package

# `@n8n/scan-community-package` is deliberately absent here. Its CLI resolves a
# package by name from the npm registry and unpacks the published tarball; it has
# no local-directory mode, and its first check is npm provenance — which a branch
# cannot have. It runs post-publish in publish.yml instead.
#
# `npm run lint` is the pre-merge equivalent: @n8n/eslint-plugin-community-nodes
# enforces n8n's verification rules across the whole repo, tests included.
