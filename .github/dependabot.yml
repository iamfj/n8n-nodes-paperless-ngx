# Dependabot over Renovate: it is built into GitHub and needs no third-party app
# installed on the account, and this repo's update surface is small enough that
# Renovate's extra configurability would not pay for that setup cost.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The package ships zero runtime dependencies, so every update here is
    # tooling. One PR a week beats eight.
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - '*'
    ignore:
      # n8n-workflow is a peer dependency: its range declares which n8n versions
      # this node supports. Widening or moving it is a compatibility decision
      # that belongs to a human reading the n8n changelog, not to a bot.
      - dependency-name: n8n-workflow
      # Same reasoning — the CLI's major version is tied to the node API and to
      # the provenance support that publish.yml depends on.
      - dependency-name: '@n8n/node-cli'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
